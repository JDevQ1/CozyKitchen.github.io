<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cooking Game</title>
</head>
<body>

<h1>Score: <span id="score">0</span></h1>
<h2>Time: <span id="timer">60</span></h2>

<div class="pot-area">
  <h2>🥘 Cooking Pot</h2>

  <div id="potContents"></div>

  <button onclick="cook()">🔥 Cook!</button>
  <button onclick="clearPot()">🗑️ Clear</button>
  <button onclick="resetGame()">♻️ Reset</button>
</div>

<div id="resultPanel">Ready when you are, chef!</div>

<h2>🥕 Ingredients</h2>
<div id="ingredientGrid"></div>

<script src="game.js"></script>
</body>
</html>
